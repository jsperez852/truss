name: Bug report
description: Something in Truss doesn't work as documented.
labels: [bug]
body:
  - type: input
    id: truss
    attributes:
      label: Truss version
      description: The version in addons/truss/plugin.cfg.
      placeholder: "0.6.0"
    validations:
      required: true
  - type: input
    id: godot
    attributes:
      label: Godot version
      description: From Help → About. Say if it's the .NET build.
      placeholder: "4.5.1 stable (standard)"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest code that shows it
      description: A script or a minimal project. Paste the output or error too.
      render: gdscript
    validations:
      required: true
